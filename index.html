<script>
async function loadApprovedPhotos() {
    const username = "arabalikanata";
    const repo = "91photo-warehouse";
    const folder = "Approved Photos";

    const apiUrl = `https://api.github.com/repos/arabalikanata/91photo-warehouse/contents/Approved Photos;

    try {
        const response = await fetch(apiUrl);
        const files = await response.json();

        const gallery = document.getElementById("approved-gallery");

        files.forEach(file => {
            if (file.type === "file" && file.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                const img = document.createElement("img");
                img.src = file.download_url;
                img.style.width = "250px";
                img.style.margin = "10px";
                img.style.borderRadius = "8px";
                gallery.appendChild(img);
            }
        });

    } catch (error) {
        console.error("加载失败:", error);
    }
}

loadApprovedPhotos();
</script>
