<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>91photos官方站</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
    }

    #approved-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      max-width: 1200px;
      margin: 20px auto;
    }

    #approved-gallery img {
      width: 100%;
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      #approved-gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .btn {
      display: inline-block;
      padding: 10px 16px;
      background-color: #0070f3;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      margin: 20px;
    }

    .btn:hover {
      background-color: #0059c1;
    }
  </style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥵</text></svg>">
</head>

<body>

<h1>✈️☕️91photos官方站</h1>
<p>一个致力于收集各种阴间飞机照片的网站</p>
<p>网页开发中...</p>

<h2>已通过照片</h2>
<a href="guide.html" class="btn">传图</a>
<div id="approved-gallery"></div>

<script>
async function loadApprovedPhotos() {
    const apiUrl = "https://api.github.com/repos/arabalikanata/91photo-warehouse/contents/approved”;

    try {
        const response = await fetch(apiUrl);
        const files = await response.json();

        const gallery = document.getElementById("approved-gallery");

        files.forEach(file => {
            if (file.type === "file" && file.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                const img = document.createElement("img");
                img.src = file.download_url;
                gallery.appendChild(img);
            }
        });

    } catch (error) {
        console.error("加载失败:", error);
    }
}

loadApprovedPhotos();
</script>

</body>
</html>
